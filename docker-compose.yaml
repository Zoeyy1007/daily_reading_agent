services:
  db:
    image: pgvector/pgvector:pg17
    container_name: daily-reading-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: daily_reading
      POSTGRES_USER: daily_reading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - daily_reading_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daily_reading -d daily_reading"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  daily_reading_pgdata: